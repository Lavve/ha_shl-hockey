# A notification five minutes before puck drop.
# The time trigger follows the next game sensor, so it moves on to the
# next game by itself.
#
# Requires: nothing.
# Team: replace "frolunda_hc" with your team's entity prefix.
# Notify: replace "notify.mobile_app_your_phone" with your own notify action.

alias: Frölunda plays in five minutes
description: Notification five minutes before puck drop.
triggers:
  - trigger: time
    at:
      entity_id: sensor.frolunda_hc_next_game
      offset: "-00:05:00"
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: 🏒 Frölunda plays in five minutes!
      message: >-
        {{ state_attr('sensor.frolunda_hc_next_game', 'home_team') }} –
        {{ state_attr('sensor.frolunda_hc_next_game', 'away_team') }}
        · {{ state_attr('sensor.frolunda_hc_next_game', 'venue') }}
mode: single
