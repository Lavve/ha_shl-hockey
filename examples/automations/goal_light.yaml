# Flash a light when your team scores.
# The goal event only exists with live updates on (Configure → Live updates).
#
# Requires: live updates.
# Team: replace "frolunda_hc" with your team's entity prefix.
# Light: replace "light.living_room" with your own light.

alias: Frölunda scores
description: Flash a light when Frölunda scores.
triggers:
  - trigger: event.received
    target:
      entity_id: event.frolunda_hc_goal
    options:
      event_type:
        - goal_for
actions:
  - action: light.turn_on
    target:
      entity_id: light.living_room
    data:
      flash: long
mode: single
