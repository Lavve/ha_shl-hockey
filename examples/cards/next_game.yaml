# Next game: countdown before puck drop, "live" during the game,
# and the final score for 6 hours after the game.
#
# Requires: nothing (built-in Markdown card).
# Optional: card-mod, for the tighter heading margins at the bottom.
# Team: replace "frolunda_hc" with your team's entity prefix.

type: markdown
content: |
  {%- set nx = 'sensor.frolunda_hc_next_game' -%}
  {%- set lg = 'sensor.frolunda_hc_last_game' -%}
  {%- set start = as_datetime(states(nx), none) -%}
  {%- set ls = state_attr(lg, 'start') -%}
  {%- set last_start = ls if ls is datetime else as_datetime(ls, none) -%}
  {%- set final = last_start is not none and now() < last_start + timedelta(hours=6) -%}
  {%- set src = lg if final else nx -%}
  {%- set mins = ((now() - start).total_seconds() / 60) | int if start else none -%}
  {%- set results = {'win': '🟢 Win', 'loss': '🔴 Loss',
      'overtime_win': '🟢 Win (OT)', 'overtime_loss': '🔴 Loss (OT)',
      'shootout_win': '🟢 Win (SO)', 'shootout_loss': '🔴 Loss (SO)'} -%}
  <table width="100%"><tr>
  <td width="30%" align="center"><img src="{{ state_attr(src, 'home_logo') }}" width="64" height="64"><br><b>{{ state_attr(src, 'home_team') }}</b></td>
  <td align="center">
  {%- if final %}
    <sup>FINAL</sup><h1>{{ state_attr(lg, 'home_score') }} – {{ state_attr(lg, 'away_score') }}</h1>
    {{ results.get(states(lg), '') }}
  {%- elif mins is not none and mins < 0 %}
    {%- set m = -mins -%}
    <sup>PUCK DROP IN</sup><h1>{{ (m // 60 ~ ' h ') if m >= 60 else '' }}{{ m % 60 }} min</h1>
    {{ (start | as_local).strftime('%H:%M') }} · {{ state_attr(nx, 'venue') }}
  {%- elif mins is not none and mins < 165 %}
    <sup>🔴 LIVE</sup><h1>vs</h1>
    {{ state_attr(nx, 'venue') }}
  {%- else %}
    <sup>GAME OVER</sup><h1>vs</h1>Waiting for the result…
  {%- endif %}
  </td>
  <td width="30%" align="center"><img src="{{ state_attr(src, 'away_logo') }}" width="64" height="64"><br><b>{{ state_attr(src, 'away_team') }}</b></td>
  </tr></table>
card_mod:
  style:
    ha-markdown$: |
      h1 {
        margin: 4px 0;
        line-height: 1.1;
      }
